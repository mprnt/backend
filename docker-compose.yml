services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mprnt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mprnt
      POSTGRES_USER: mprnt_user
      POSTGRES_PASSWORD: mprnt_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - mprnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mprnt_user -d mprnt"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage)
  minio:
    image: quay.io/minio/minio:latest
    container_name: mprnt-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - mprnt-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client - Create bucket on startup
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: mprnt-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minio_admin minio_password;
      mc mb myminio/mprnt-documents --ignore-existing;
      mc anonymous set download myminio/mprnt-documents;
      exit 0;
      "
    networks:
      - mprnt-network

  # Adminer (Database UI)
  adminer:
    image: adminer:latest
    container_name: mprnt-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - mprnt-network

  # Backend API (optional - uncomment when ready)
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: mprnt-api
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NODE_ENV: development
  #     PORT: 3000
  #     DATABASE_URL: postgresql://mprnt_user:mprnt_password@postgres:5432/mprnt
  #     S3_ENDPOINT: http://minio:9000
  #     AWS_ACCESS_KEY_ID: minio_admin
  #     AWS_SECRET_ACCESS_KEY: minio_password
  #     S3_BUCKET_NAME: mprnt-documents
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #   volumes:
  #     - ./src:/app/src
  #     - ./node_modules:/app/node_modules
  #   networks:
  #     - mprnt-network

networks:
  mprnt-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
